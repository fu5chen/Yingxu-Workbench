# Example only: replace domain and certificate paths before installing.
# Keep the application ports bound to loopback; expose the authenticated gateway.
server {
    listen 443 ssl;
    server_name studio.example.com;
    ssl_certificate /etc/ssl/your-domain/fullchain.pem;
    ssl_certificate_key /etc/ssl/your-domain/privkey.pem;
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:5191;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
        proxy_buffering off;
        # Never replay paid POST requests after an ambiguous upstream failure.
        proxy_next_upstream off;
    }
}
